name: nazar_e_alam
description: A new Flutter project.
publish_to: "none"
version: 2.6.0+17

environment:
  sdk: ">=3.9.0 <4.0.0"

#==== Dependencies start ====#
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  get: ^4.6.6
  shared_preferences: ^2.2.2
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  google_maps_flutter: ^2.5.0
  intl: ^0.20.2
  http: ^1.1.0
  path: ^1.8.3
  http_parser: ^4.0.2
  hijri: ^3.0.0
  vibration: ^3.1.3
  url_launcher: ^6.1.10
  flutter_launcher_icons: ^0.14.4
  flutter_svg: ^2.0.9
  #  google_fonts: ^8.0.1
  sqflite: ^2.3.0
  flutter_timezone: ^5.1.1
  #  prayers_times: ^0.0.6
  share_plus: ^13.3.1
  permission_handler: ^13.0.2
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  flutter_qiblah_advanced: ^4.0.1
  # flutter_qiblah: ^3.1.0+1
  # razorpay_flutter: ^1.3.7
  # flutter_paypal: ^0.2.1
  # flutter_stripe: ^12.0.2
  # flutter_paystack_plus: ^2.0.4
  shimmer: ^4.0.0
  scrollable_positioned_list: ^0.3.8
  just_audio: ^0.10.5
  audio_service: ^0.18.15
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^4.0.7
  photo_view: ^0.15.0
  wallpaper_setter: ^2.1.0
  path_provider: ^2.1.3
  # flutter_tts: ^4.2.3
  stts: ^1.3.4
  connectivity_plus: ^7.3.1
  flutter_sslcommerz: ^3.0.2
  google_fonts: ^9.0.0
  flutter_displaymode: ^0.7.0
  flutter_native_splash: ^2.4.8
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0

  # just_audio: ^0.9.38
  # path_provider: ^2.1.3

#==== Dev Dependencies start ====#
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/nazar_e_aalam_logo.png"

flutter:
  uses-material-design: true

  #==== Assets start ====#
  assets:
    - assets/icon/
    - assets/icon/flag/
    - assets/icon/modern-icons/svg/
    - assets/language/
    - assets/audio/
    - assets/quran/
    - assets/quran/ar/
    - assets/quran/en/
    - assets/quran/hi/
    - assets/quran/guj/
    - assets/quran/ur/
    - assets/quran/sw/
    - assets/names/
    - assets/memorable_days/
    - assets/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto-Black.ttf
          weight: 900

    - family: Scheherazade New
      fonts:
        - asset: assets/font/ScheherazadeNew-Regular.ttf
          weight: 400

    - family: Amiri
      fonts:
        - asset: assets/font/Amiri-Regular.ttf
          weight: 400

    - family: AmiriQuran
      fonts:
        - asset: assets/font/AmiriQuran-Regular.ttf
          weight: 400

    - family: Lateef
      fonts:
        - asset: assets/font/Lateef-Regular.ttf
          weight: 400

    - family: NotoKufiArabic
      fonts:
        - asset: assets/font/NotoKufiArabic-Regular.ttf
          weight: 400

    - family: NotoNaskhArabic
      fonts:
        - asset: assets/font/NotoNaskhArabic-Regular.ttf
          weight: 400

    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/font/NotoNastaliqUrdu-Regular.ttf
          weight: 400

    - family: NotoSansArabic
      fonts:
        - asset: assets/font/NotoSansArabic-Regular.ttf
          weight: 400

    - family: ReadexPro
      fonts:
        - asset: assets/font/ReadexPro-Regular.ttf
          weight: 400
